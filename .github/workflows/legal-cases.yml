name: legal-cases

on:
  push:
    branches: [main]
    paths: ["projects/legal-cases/**", ".github/workflows/legal-cases.yml"]
  pull_request:
    paths: ["projects/legal-cases/**", ".github/workflows/legal-cases.yml"]

permissions:
  contents: read

concurrency:
  group: legal-cases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/legal-cases
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/legal-cases/package-lock.json
      - run: make ci

  image:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: projects/legal-cases
          push: true
          tags: |
            ghcr.io/agustinbertero/portfolio-legal-cases:latest
            ghcr.io/agustinbertero/portfolio-legal-cases:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=legal-cases
          cache-to: type=gha,mode=max,scope=legal-cases
