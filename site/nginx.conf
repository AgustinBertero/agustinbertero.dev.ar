# site/nginx.conf — static export for the landing at /.
# The gateway terminates TLS and sets the public CSP; this server only serves files.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;

    # Next.js emits fingerprinted files; the HTML must revalidate.
    location /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        try_files $uri =404;
    }

    location /cv/ {
        expires 1d;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /error/index.html;
    location = /error/index.html {
        internal;
    }
}
