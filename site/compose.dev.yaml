# site/compose.dev.yaml — local preview of the landing image.
#   cd site && docker compose -f compose.dev.yaml up --build
# Serves http://127.0.0.1:8080/ (loopback only).

name: portfolio-site-dev

services:
  site-web:
    build:
      context: .
    image: ghcr.io/agustinbertero/portfolio-site:latest
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${SITE_PORT:-8080}:8080"
