# infra/gateway/projects/helpdesk.conf — Helpdesk demo at /helpdesk/
location = /helpdesk {
    return 301 /helpdesk/;
}

location /helpdesk/ {
    limit_req zone=perip burst=30 nodelay;

    set $up_helpdesk http://helpdesk-web:8080;
    rewrite ^/helpdesk/(.*)$ /$1 break;
    proxy_pass $up_helpdesk;
    proxy_set_header X-Forwarded-Prefix /helpdesk;

    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}

# Triage runs a paid LLM call: keep it behind the strict AI zone.
location ~ ^/helpdesk/tickets/[0-9]+/triage$ {
    limit_req zone=ai burst=3 nodelay;

    set $up_helpdesk_ai http://helpdesk-web:8080;
    rewrite ^/helpdesk/(.*)$ /$1 break;
    proxy_pass $up_helpdesk_ai;
    proxy_set_header X-Forwarded-Prefix /helpdesk;

    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
