# infra/gateway/conf.d/default.conf
# Gateway del portfolio: único punto de entrada (cloudflared → gateway:8080).
# Se monta en /etc/nginx/conf.d/, dentro del contexto http.

server_tokens off;
client_max_body_size 5m;

# DNS interno de Docker, resuelto en cada request: un proyecto caído no impide arrancar el gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

# IP real del visitante. cloudflared llega desde la red "edge" (misma subred que en infra/compose.yaml).
set_real_ip_from 172.30.10.0/24;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Si vino por Cloudflare (trae CF-Connecting-IP) es https; si no, es local.
map $http_cf_connecting_ip $fwd_proto {
    default https;
    ''      $scheme;
}

limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ai:10m rate=6r/m;
limit_req_status 429;

server {
    listen 8080 default_server;
    server_name agustinbertero.dev.ar localhost;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Un archivo por proyecto (los crea la skill nuevo-proyecto).
    include /etc/nginx/projects/*.conf;

    # Landing
    location / {
        limit_req zone=perip burst=50 nodelay;

        set $up_site http://site-web:8080;
        proxy_pass $up_site;

        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        # Next.js con export estático usa scripts inline y en estático no hay nonces posibles.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
