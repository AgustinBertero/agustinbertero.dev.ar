# Private legal case app. Cloudflare Access should gate this hostname in Zero Trust.
server {
    listen 8080;
    server_name casos.bertium.net;
    server_tokens off;

    client_max_body_size 20m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_req zone=perip burst=30 nodelay;

        set $up_legal http://legal-web:8080;
        proxy_pass $up_legal;

        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
