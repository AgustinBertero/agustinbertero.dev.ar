# .github/workflows/<slug>.yml
# Reemplazar <slug>. Para la landing: slug "site" y rutas "site/" en vez de "projects/<slug>/".
name: <slug>

on:
  push:
    branches: [main]
    paths: ["projects/<slug>/**", ".github/workflows/<slug>.yml"]
  pull_request:
    paths: ["projects/<slug>/**", ".github/workflows/<slug>.yml"]

permissions:
  contents: read

concurrency:
  group: <slug>-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Siempre runners de GitHub. Nunca self-hosted: el repo es público.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/<slug>
    steps:
      - uses: actions/checkout@v5
      - run: make ci

  image:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: projects/<slug>
          push: true
          tags: |
            ghcr.io/agustinbertero/portfolio-<slug>:latest
            ghcr.io/agustinbertero/portfolio-<slug>:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=<slug>
          cache-to: type=gha,mode=max,scope=<slug>
