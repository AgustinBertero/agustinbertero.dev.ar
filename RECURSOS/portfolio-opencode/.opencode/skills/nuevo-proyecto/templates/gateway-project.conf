# infra/gateway/projects/<slug>.conf — <Project name>
# Reemplazar <slug> (ej. odoo-sync) y <slug_> (el mismo slug con "_": odoo_sync).

location = /<slug> {
    return 301 /<slug>/;
}

# Variante por defecto: el gateway quita /<slug> y lo avisa con X-Forwarded-Prefix.
location /<slug>/ {
    limit_req zone=perip burst=30 nodelay;

    set $up_<slug_> http://<slug>-web:8080;
    rewrite ^/<slug>/(.*)$ /$1 break;
    proxy_pass $up_<slug_>;
    proxy_set_header X-Forwarded-Prefix /<slug>;

    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}

