# projects/legal-cases/compose.dev.yaml — local preview.
name: portfolio-legal-dev

services:
  legal-web:
    build: .
    image: ghcr.io/agustinbertero/portfolio-legal-cases:latest
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8011
      SESSION_PATH: /
      SESSION_SECURE_COOKIE: "false"
      DB_CONNECTION: pgsql
      DB_HOST: legal-db
      DB_PORT: "5432"
      DB_DATABASE: legal
      DB_USERNAME: legal
      DB_PASSWORD: legal
    ports:
      - "127.0.0.1:8011:8080"
    volumes:
      - legal_dev_storage:/var/www/html/storage/app
    depends_on:
      legal-db:
        condition: service_healthy

  legal-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: legal
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
    volumes:
      - legal_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  legal_dev_storage:
  legal_dev_db:
